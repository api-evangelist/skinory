description: Skinory offers a free, public read‑only JSON API delivering real‑time CS2 and CS:GO skin price data, historical price trends, Steam
  inventory valuation, and detailed statistics for professional teams and players. The service operates without authentication for basic limits,
  supports optional API keys for higher quotas, and enforces open CORS for client‑side use. Comprehensive documentation, including endpoint details,
  rate limits, and licensing information, is available at https://skinory.io/en/developers, with the full OpenAPI 3.1 specification provided at
  /api/openapi.json.

